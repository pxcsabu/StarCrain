[package]
name = "starcrane"
version = "0.4.0"
description = "StarCrane — Modern Rust Planetarium & Astronomical Suite"
authors = ["StarCrane Developers"]
edition = "2024"

[lib]
name = "starcrane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
vsop87 = "3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sgp4 = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.dev.package.serde]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.vsop87]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 2
